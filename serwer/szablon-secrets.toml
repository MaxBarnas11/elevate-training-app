# Szablon sekretow logowania Google. Na serwerze zapisz jako /home/struo/app/.streamlit/secrets.toml
# i ustaw: chmod 600 /home/struo/app/.streamlit/secrets.toml
# Puste pola ("") uzupelniasz recznie na serwerze (nano). Nigdy nie wklejasz ich do czatu ani do gita.
# cookie_secret: wygeneruj poleceniem  python3 -c "import secrets; print(secrets.token_urlsafe(48))"
# client_id i client_secret: z Google Cloud (klient OAuth).
[auth]
redirect_uri = "https://struo.TWOJA-DOMENA.pl/oauth2callback"
cookie_secret = ""
client_id = ""
client_secret = ""
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[server]
# Pliki z folderu static (ikona na ekran początkowy iPhone'a) dostępne pod adresem /app/static/...
enableStaticServing = true

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1B1B1A"
backgroundColor = "#E9DFCB"
secondaryBackgroundColor = "#DDD0B6"
textColor = "#1B1B1A"

[theme.dark]
primaryColor = "#FF3D9A"
backgroundColor = "#050506"
secondaryBackgroundColor = "#0F0F12"
textColor = "#F5F3FA"

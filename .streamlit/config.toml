[server]
# Pliki z folderu static (ikona na ekran początkowy iPhone'a) dostępne pod adresem /app/static/...
enableStaticServing = true
# Ochrona przed podszywaniem sie pod uzytkownika przez obca strone (CSRF) i przed obcymi domenami (CORS); to domyslne ustawienia, jawnie dla pewnosci
enableXsrfProtection = true
enableCORS = true

[browser]
# Bez wysylania statystyk uzycia do Streamlita
gatherUsageStats = false

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1B1B1A"
backgroundColor = "#E9DFCB"
secondaryBackgroundColor = "#DDD0B6"
textColor = "#1B1B1A"

[theme.dark]
primaryColor = "#FF3D9A"
backgroundColor = "#050506"
secondaryBackgroundColor = "#0F0F12"
textColor = "#F5F3FA"
